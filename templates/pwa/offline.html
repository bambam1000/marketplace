{% load static %}<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#ff6a00">
<title>Hors ligne — Comptoir</title>
<link rel="icon" type="image/svg+xml" href="{% static 'images/brand/favicon.svg' %}">
<style>
:root { --orange: #ff6a00; --text: #1a1a1a; --text2: #555; --bg: #f5f5f5; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; background: var(--bg); color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
.box { max-width: 360px; width: 100%; background: #fff; border-radius: 16px; padding: 32px 24px; box-shadow: 0 4px 24px rgba(0,0,0,.06); }
img { width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 18px; display: block; }
h1 { font-size: 20px; margin-bottom: 8px; }
p { font-size: 14px; color: var(--text2); line-height: 1.6; }
button { margin-top: 22px; width: 100%; padding: 13px; border: none; border-radius: 10px; background: var(--orange); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
</style>
</head>
<body>
<div class="box">
  <img src="{% static 'images/pwa/icon-192.png' %}" alt="Comptoir">
  <h1>Vous êtes hors ligne</h1>
  <p>Impossible de charger cette page sans connexion. Vérifiez vos données mobiles ou le Wi-Fi, puis réessayez.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
</div>
<script>window.addEventListener('online', function() { location.reload(); });</script>
</body>
</html>
