<!DOCTYPE html>
<html><body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,sans-serif;">
<div style="max-width:600px;margin:0 auto;background:#fff;">
    <div style="background:#ff6a00;padding:24px;text-align:center;">
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 auto;"><tr><td style="padding-right:10px;vertical-align:middle;"><img src="{{ site_url }}/static/images/brand/mark-inverse-96.png" width="40" height="40" alt="" style="display:block;border:0;border-radius:10px;"></td><td style="vertical-align:middle;color:#fff;font-size:24px;font-weight:800;letter-spacing:-.5px;font-family:Arial,sans-serif;">Comptoir</td></tr></table>
    </div>
    <div style="padding:32px 28px;color:#333;font-size:14px;line-height:1.7;">
        <p>Bonjour {{ user.first_name|default:user.username }},</p>
        <h2 style="font-size:18px;color:#101828;margin:0 0 10px;">{{ title }}</h2>
        <p style="white-space:pre-line;">{{ message }}</p>
        {% if url %}
        <div style="text-align:center;margin:24px 0;">
            <a href="{{ url }}" style="display:inline-block;background:#ff6a00;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-weight:700;">Voir les détails</a>
        </div>
        {% endif %}
    </div>
    <div style="background:#f9fafb;padding:18px;text-align:center;font-size:11px;color:#98a2b3;">
        Comptoir
    </div>
</div>
</body></html>
