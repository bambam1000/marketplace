{% extends 'base.html' %}{% load humanize %}
{% block title %}Commande confirmée{% endblock %}
{% block content %}
<div style="text-align:center;max-width:600px;margin:0 auto;padding:4rem 2rem;">
<div style="font-size:4rem;margin-bottom:1rem;">🎉</div>
<h2 style="font-size:22px;margin-bottom:8px;">Commande confirmée !</h2>
<p style="color:var(--text2);margin-bottom:2rem;">Votre commande <strong>{{ order.order_number }}</strong> a été enregistrée. Total: <strong style="color:var(--red);">{{ order.total_amount|intcomma }} FCFA</strong></p>
<div style="display:flex;gap:10px;justify-content:center;">
<a href="{% url 'orders:detail' order.order_number %}" class="btn btn-orange">Voir ma commande</a>
<a href="{% url 'home' %}" class="btn btn-outline">Retour à l'accueil</a>
</div>
</div>
{% endblock %}
