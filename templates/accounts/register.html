{% load static %}
<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Inscription — AfriMarket</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body>
<div class="auth-page">
<div class="auth-card" style="max-width:500px;">
<div style="text-align:center;margin-bottom:1rem;"><span class="logo" style="font-size:1.4rem;">Afri<span>Market</span></span></div>
<h1>Inscription</h1><p class="subtitle">Créez votre compte gratuitement</p>
{% if messages %}{% for msg in messages %}<div class="alert alert-error">{{ msg }}</div>{% endfor %}{% endif %}
<form method="post">{% csrf_token %}
<div class="auth-tabs"><div class="auth-tab active" onclick="document.getElementById('role').value='buyer';this.classList.add('active');this.nextElementSibling.classList.remove('active');document.getElementById('store-field').style.display='none';">🛒 Acheteur</div><div class="auth-tab" onclick="document.getElementById('role').value='seller';this.classList.add('active');this.previousElementSibling.classList.remove('active');document.getElementById('store-field').style.display='block';">🏪 Vendeur</div></div>
<input type="hidden" name="role" id="role" value="buyer">
<div class="form-row"><div class="form-group"><label>Prénom</label><input type="text" name="first_name" class="form-control"></div><div class="form-group"><label>Nom</label><input type="text" name="last_name" class="form-control"></div></div>
<div class="form-group"><label>Nom d'utilisateur *</label><input type="text" name="username" class="form-control" required></div>
<div class="form-row"><div class="form-group"><label>Email *</label><input type="email" name="email" class="form-control" required></div><div class="form-group"><label>Téléphone</label><input type="tel" name="phone" class="form-control" placeholder="+237 6XX XXX XXX"></div></div>
<div class="form-group"><label>Mot de passe *</label><input type="password" name="password" class="form-control" required></div>
<div class="form-group" id="store-field" style="display:none;"><label>Nom de votre boutique</label><input type="text" name="store_name" class="form-control" placeholder="Ma Super Boutique"></div>
<button type="submit" class="btn btn-orange btn-lg btn-block">Créer mon compte</button>
</form>
<div style="text-align:center;margin-top:1rem;font-size:13px;">Déjà inscrit ? <a href="{% url 'accounts:login' %}" style="color:var(--orange);font-weight:600;">Se connecter</a></div>
</div></div></body></html>
